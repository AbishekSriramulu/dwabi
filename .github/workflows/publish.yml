name: Publish D-wabi

on:
  workflow_dispatch:
    inputs:
      wheel_sha256:
        description: SHA-256 of the verified release wheel
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - name: Build the benchmark wheel
        run: |
          chmod +x src/dwabi/*.py
          python -m build --no-isolation
      - name: Verify release identity
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          python - <<'PY'
          from hashlib import file_digest
          import os
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          with wheel.open("rb") as stream:
              actual = file_digest(stream, "sha256").hexdigest()
          if actual != os.environ["EXPECTED_WHEEL_SHA256"].strip().lower():
              raise SystemExit(f"Release wheel digest differs: {actual}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
