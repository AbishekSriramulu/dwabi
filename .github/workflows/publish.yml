name: Publish D-wabi

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build run ID. Leave blank to build a wheel for review.
        required: false
        type: string
      wheel_sha256:
        description: SHA-256 of the reviewed wheel. Required when publishing.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: inputs.build_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - name: Build the wheel for review
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          test -z "$EXPECTED_WHEEL_SHA256"
          python scripts/build_wheel.py
          sha256sum dist/*.whl
          git rev-parse HEAD > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-wheel
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.build_run_id != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-wheel
          path: reviewed/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify the reviewed artifact before publication
        env:
          EXPECTED_WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
        run: |
          record=$(cat reviewed/SOURCE_COMMIT)
          test "$record" = "$GITHUB_SHA"
          python - <<'PY'
          from hashlib import file_digest
          import os
          from pathlib import Path
          from shutil import copyfile
          wheel, = Path("reviewed").glob("*.whl")
          with wheel.open("rb") as stream:
              actual = file_digest(stream, "sha256").hexdigest()
          if actual != os.environ["EXPECTED_WHEEL_SHA256"].strip().lower():
              raise SystemExit(f"Release wheel digest differs: {actual}")
          Path("dist").mkdir()
          copyfile(wheel, Path("dist") / wheel.name)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1